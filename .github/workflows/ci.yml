name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
      - run: mvn -B -Pquality verify -DskipTests

  deployment-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - run: helm lint deploy/helm/atlas-warehouse-infra
      - run: helm lint deploy/helm/atlas-warehouse-operator
      - run: helm template atlas-warehouse deploy/helm/atlas-warehouse-infra > /tmp/infra.yaml
      - run: helm template atlas-warehouse-operator deploy/helm/atlas-warehouse-operator --include-crds > /tmp/operator.yaml
      - run: helm template atlas-warehouse-operator deploy/helm/atlas-warehouse-operator --set mocDiscovery.enabled=false >/tmp/operator-no-moc.yaml
      - run: helm template atlas-warehouse deploy/helm/atlas-warehouse-infra --set kafka.enabled=true >/tmp/infra-kafka.yaml
      - run: docker compose -f deploy/compose/compose.yaml config
      - run: docker compose -f deploy/compose/compose.yaml --profile kafka config
      - run: ./scripts/sync-index-mappings.sh --check
      - run: git diff --check

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: '**/*.md'

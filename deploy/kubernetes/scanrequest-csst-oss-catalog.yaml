apiVersion: atlas.zhejianglab.org/v1alpha1
kind: ScanRequest
metadata:
  name: csst-w1-oss-catalog
  namespace: atlas-warehouse
spec:
  scanner:
    image: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-atlas-scanner:0.2.0-20260825-fix2
    backoffLimit: 0
    activeDeadlineSeconds: 1800
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
    evidence:
      claimName: atlas-evidence-smoke
      mountPath: /var/lib/atlas-evidence
  credentials:
    source:
      secretName: atlas-oss-csst-credentials
      accessKeyKey: accessKey
      secretKeyKey: secretKey
  plan:
    version: 2
    scanRunId: csst-w1-oss-catalog-newinfra-20260826
    layer:
      layerId: csst-w1-phot-catalog
      surveyId: csst
      releaseId: csst-sim-w1-20250731
      productId: csst-w1-phot-catalog
      modality: catalog
      coverageRole: occupancy
      entrypoint: http://oss-cn-hangzhou-zjy-d01-a.res.cloud.zhejianglab.com/data-and-computing/projects/CSST/shared-data/simulation-1000-w1-20250731/outputs_wide1000sqdeg/W1_Phot/
    source:
      connector:
        type: oss
        endpoint: http://oss-cn-hangzhou-zjy-d01-a.res.cloud.zhejianglab.com
        region: cn-hangzhou-zjy-d01
        credentialRef:
          accessKeyEnv: ATLAS_SOURCE_ACCESS_KEY
          secretKeyEnv: ATLAS_SOURCE_SECRET_KEY
      location:
        bucket: data-and-computing
        prefix: projects/CSST/shared-data/simulation-1000-w1-20250731/outputs_wide1000sqdeg/W1_Phot/10600040267/CSST_MSC_MS_WIDE_20221210122144_20221210122414_10600040267_06_L0_V01.cat
    filters:
      includeSuffixes:
        - .cat
    extraction:
      mode: catalog-radec
      outputOrder: 8
      catalog:
        raColumn: ra
        decColumn: dec
    sink:
      connector:
        type: elasticsearch
        endpoint: http://atlas-warehouse-elasticsearch.atlas-warehouse.svc.cluster.local:9200
        credentialRef: {}
    evidence:
      outputPath: /var/lib/atlas-evidence/csst-w1-oss-catalog-newinfra-20260826

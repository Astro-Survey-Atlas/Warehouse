apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scanrequests.atlas.zhejianglab.org
spec:
  group: atlas.zhejianglab.org
  scope: Namespaced
  names:
    plural: scanrequests
    singular: scanrequest
    kind: ScanRequest
    shortNames:
      - atlas-scan
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Job
          type: string
          jsonPath: .status.jobName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - plan
              properties:
                plan:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                scanner:
                  type: object
                  properties:
                    image:
                      type: string
                    serviceAccountName:
                      type: string
                    backoffLimit:
                      type: integer
                      minimum: 0
                    activeDeadlineSeconds:
                      type: integer
                      format: int64
                      minimum: 1
                    ttlSecondsAfterFinished:
                      type: integer
                      minimum: 0
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          additionalProperties:
                            type: string
                        limits:
                          type: object
                          additionalProperties:
                            type: string
                    evidence:
                      type: object
                      required:
                        - claimName
                      properties:
                        claimName:
                          type: string
                          minLength: 1
                        mountPath:
                          type: string
                          default: /var/lib/atlas-evidence
                        readOnly:
                          type: boolean
                credentials:
                  type: object
                  properties:
                    source:
                      type: object
                      properties:
                        secretName:
                          type: string
                        accessKeyKey:
                          type: string
                        secretKeyKey:
                          type: string
                        usernameKey:
                          type: string
                        passwordKey:
                          type: string
                    sink:
                      type: object
                      properties:
                        secretName:
                          type: string
                        accessKeyKey:
                          type: string
                        secretKeyKey:
                          type: string
                        usernameKey:
                          type: string
                        passwordKey:
                          type: string
              x-kubernetes-validations:
                - rule: "has(self.plan)"
                  message: "spec.plan is required"
            status:
              type: object
              properties:
                phase:
                  type: string
                jobName:
                  type: string
                reason:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: string
                lastTransitionTime:
                  type: string
                  format: date-time
                summary:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: mocdiscoveryrequests.atlas.zhejianglab.org
spec:
  group: atlas.zhejianglab.org
  scope: Namespaced
  names:
    plural: mocdiscoveryrequests
    singular: mocdiscoveryrequest
    kind: MocDiscoveryRequest
    shortNames: [atlas-moc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Survey
          type: string
          jsonPath: .spec.query.surveyName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [query, policyRef]
              properties:
                query:
                  type: object
                  required: [surveyName]
                  properties:
                    surveyName: { type: string, minLength: 1, maxLength: 200 }
                    releaseHint: { type: string, maxLength: 200 }
                    productHint: { type: string, maxLength: 200 }
                policyRef: { type: string, enum: [cds-public-moc-v1] }
            status:
              type: object
              properties:
                phase: { type: string }
                jobName: { type: string }
                reason: { type: string }
                message: { type: string }
                observedGeneration: { type: string }
                evidencePath: { type: string }
                candidateCount: { type: integer }
                probeCount: { type: integer }
                lastTransitionTime:
                  type: string
                  format: date-time
                summary:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true

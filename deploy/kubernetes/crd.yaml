apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: scanrequests.atlas.zhejianglab.org
spec:
  group: atlas.zhejianglab.org
  scope: Namespaced
  names:
    plural: scanrequests
    singular: scanrequest
    kind: ScanRequest
    shortNames:
      - atlas-scan
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Job
          type: string
          jsonPath: .status.jobName
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - plan
              properties:
                plan:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                scanner:
                  type: object
                  properties:
                    image:
                      type: string
                    serviceAccountName:
                      type: string
                    backoffLimit:
                      type: integer
                      minimum: 0
                    activeDeadlineSeconds:
                      type: integer
                      format: int64
                      minimum: 1
                    ttlSecondsAfterFinished:
                      type: integer
                      minimum: 0
                    resources:
                      type: object
                      properties:
                        requests:
                          type: object
                          additionalProperties:
                            type: string
                        limits:
                          type: object
                          additionalProperties:
                            type: string
                credentials:
                  type: object
                  properties:
                    source:
                      type: object
                      properties:
                        secretName:
                          type: string
                        accessKeyKey:
                          type: string
                        secretKeyKey:
                          type: string
                        usernameKey:
                          type: string
                        passwordKey:
                          type: string
                    sink:
                      type: object
                      properties:
                        secretName:
                          type: string
                        accessKeyKey:
                          type: string
                        secretKeyKey:
                          type: string
                        usernameKey:
                          type: string
                        passwordKey:
                          type: string
              x-kubernetes-validations:
                - rule: "has(self.plan)"
                  message: "spec.plan is required"
            status:
              type: object
              properties:
                phase:
                  type: string
                jobName:
                  type: string
                reason:
                  type: string
                message:
                  type: string
                observedGeneration:
                  type: string
                lastTransitionTime:
                  type: string
                  format: date-time
                summary:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true

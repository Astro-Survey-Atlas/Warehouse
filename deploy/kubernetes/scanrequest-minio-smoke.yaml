apiVersion: atlas.zhejianglab.org/v1alpha1
kind: ScanRequest
metadata:
  name: minio-catalog-smoke
  namespace: atlas-warehouse
spec:
  scanner:
    image: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-atlas-scanner:0.2.0-20260826-cutover1
    backoffLimit: 1
    activeDeadlineSeconds: 1800
    ttlSecondsAfterFinished: 86400
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    evidence:
      claimName: atlas-evidence-smoke
      mountPath: /var/lib/atlas-evidence
  credentials:
    source:
      secretName: atlas-warehouse-minio-credentials
      accessKeyKey: root-user
      secretKeyKey: root-password
  plan:
    version: 2
    scanRunId: minio-catalog-smoke-newinfra-20260826
    layer:
      layerId: smoke-catalog
      surveyId: smoke
      releaseId: local
      productId: catalog
      modality: catalog
      coverageRole: occupancy
    source:
      connector:
        type: s3
        endpoint: http://atlas-warehouse-minio.atlas-warehouse.svc.cluster.local:9000
        region: us-east-1
        credentialRef:
          accessKeyEnv: ATLAS_SOURCE_ACCESS_KEY
          secretKeyEnv: ATLAS_SOURCE_SECRET_KEY
      location:
        bucket: astro-artifacts
        prefix: astro/smoke/assets-four-modalities/gaia-catalog-49cf5d4b.csv
    filters:
      includeSuffixes:
        - .csv
    extraction:
      mode: catalog-radec
      outputOrder: 8
      catalog:
        raColumn: ra
        decColumn: dec
    sink:
      connector:
        type: elasticsearch
        endpoint: http://atlas-warehouse-elasticsearch.atlas-warehouse.svc.cluster.local:9200
        credentialRef: {}
    evidence:
      outputPath: /var/lib/atlas-evidence/minio-catalog-smoke-newinfra-20260826

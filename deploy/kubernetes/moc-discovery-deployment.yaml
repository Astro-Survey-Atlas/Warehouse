# Discovery has its own controller process and ServiceAccount. It never starts
# the ScanRequest controller, so rollout or failure of this deployment cannot
# mutate connector scan state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: astro-atlas-moc-discovery
  namespace: atlas-system
  labels:
    app.kubernetes.io/name: astro-atlas-moc-discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astro-atlas-moc-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astro-atlas-moc-discovery
    spec:
      serviceAccountName: astro-atlas-moc-discovery
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: moc-discovery
          image: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-atlas-operator:0.2.0-20260830-143932
          imagePullPolicy: IfNotPresent
          command: ["java", "-cp", "/app/operator.jar", "org.zhejianglab.astro.atlas.operator.MocDiscoveryMain"]
          env:
            - name: WATCH_NAMESPACES
              value: atlas-warehouse,astro-data-workspace
            - name: MOC_DISCOVERY_IMAGE
              value: crpi-wixjy6gci86ms14e.cn-hongkong.personal.cr.aliyuncs.com/ay-dev/astro-atlas-moc-discovery:0.1.0-20260830-143932
            - name: MOC_DISCOVERY_EVIDENCE_CLAIM
              value: atlas-evidence-smoke
            - name: MOC_DISCOVERY_EVIDENCE_MOUNT_PATH
              value: /var/lib/atlas-evidence
            - name: RECONCILE_INTERVAL_SECONDS
              value: "10"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

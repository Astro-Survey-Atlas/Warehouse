{{- if .Values.mocDiscovery.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.mocDiscovery.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.mocDiscovery.name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.mocDiscovery.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.mocDiscovery.name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.mocDiscovery.serviceAccount.name }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: moc-discovery
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          command: ["java", "-cp", "/app/operator.jar", "org.zhejianglab.astro.atlas.operator.MocDiscoveryMain"]
          env:
            - name: WATCH_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: MOC_DISCOVERY_IMAGE
              value: {{ .Values.mocDiscovery.image | quote }}
            - name: MOC_DISCOVERY_EVIDENCE_CLAIM
              value: {{ .Values.mocDiscovery.evidenceClaim | quote }}
            - name: MOC_DISCOVERY_EVIDENCE_MOUNT_PATH
              value: {{ .Values.mocDiscovery.evidenceMountPath | quote }}
            - name: RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.operator.reconcileIntervalSeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
{{- end }}

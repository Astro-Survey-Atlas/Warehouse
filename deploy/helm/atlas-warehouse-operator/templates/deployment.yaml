apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "atlas-warehouse-operator.fullname" . }}
  namespace: {{ .Values.operator.namespace }}
  labels:
    {{- include "atlas-warehouse-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "atlas-warehouse-operator.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "atlas-warehouse-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.operator.serviceAccount.name }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
      containers:
        - name: operator
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          env:
            - name: WATCH_NAMESPACES
              value: {{ join "," .Values.watchNamespaces | quote }}
            - name: SCANNER_IMAGE
              value: {{ .Values.scanner.image | quote }}
            - name: MOC_DISCOVERY_IMAGE
              value: {{ .Values.mocDiscovery.image | quote }}
            - name: MOC_DISCOVERY_EVIDENCE_CLAIM
              value: {{ .Values.mocDiscovery.evidenceClaim | quote }}
            - name: MOC_DISCOVERY_EVIDENCE_MOUNT_PATH
              value: {{ .Values.mocDiscovery.evidenceMountPath | quote }}
            - name: RECONCILE_INTERVAL_SECONDS
              value: {{ .Values.operator.reconcileIntervalSeconds | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}

operator:
  namespace: atlas-system
  name: astro-atlas-operator
  image:
    repository: ghcr.io/astro-survey-atlas/astro-atlas-operator
    tag: 0.1.0
    pullPolicy: IfNotPresent
  serviceAccount:
    create: true
    name: astro-atlas-operator
  replicas: 1
  reconcileIntervalSeconds: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# The operator never watches all namespaces. Add a namespace only when its
# RoleBinding is intentionally part of this release.
watchNamespaces:
  - atlas-warehouse
  - astro-data-workspace

scanner:
  image: ghcr.io/astro-survey-atlas/astro-atlas-scanner:0.1.0

mocDiscovery:
  image: ghcr.io/astro-survey-atlas/astro-atlas-moc-discovery:0.1.0
  evidenceClaim: atlas-evidence
  evidenceMountPath: /var/lib/atlas-evidence

imagePullSecrets: []

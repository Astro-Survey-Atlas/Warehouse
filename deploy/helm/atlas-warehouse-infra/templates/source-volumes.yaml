{{- range .Values.sourceVolumes }}
{{- $claimName := required "sourceVolumes[].claimName is required" .claimName -}}
{{- $pvName := printf "%s-pv" $claimName | trunc 63 | trimSuffix "-" -}}
{{- if .nfs }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ $pvName }}
  labels:
    {{- include "atlas-warehouse-infra.labels" $ | nindent 4 }}
    {{ $.Values.sourceVolumesLabelKey }}: "true"
spec:
  capacity:
    storage: {{ .capacity | default "1Ti" | quote }}
  accessModes:
    {{- toYaml (.accessModes | default (list "ReadOnlyMany")) | nindent 4 }}
  persistentVolumeReclaimPolicy: {{ .reclaimPolicy | default "Retain" | quote }}
  storageClassName: {{ .storageClassName | default "" | quote }}
  nfs:
    server: {{ required "sourceVolumes[].nfs.server is required" .nfs.server | quote }}
    path: {{ required "sourceVolumes[].nfs.path is required" .nfs.path | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $claimName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "atlas-warehouse-infra.labels" $ | nindent 4 }}
    {{ $.Values.sourceVolumesLabelKey }}: "true"
spec:
  accessModes:
    {{- toYaml (.accessModes | default (list "ReadOnlyMany")) | nindent 4 }}
  storageClassName: {{ .storageClassName | default "" | quote }}
  volumeName: {{ $pvName }}
  resources:
    requests:
      storage: {{ .capacity | default "1Ti" | quote }}
---
{{- else if not .existingClaim }}
{{- fail (printf "source volume %s must define nfs or existingClaim: true" $claimName) }}
{{- end }}
{{- end }}

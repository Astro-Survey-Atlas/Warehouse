# This chart owns its component names and storage. It has no dependency on the
# legacy `warehouse` Helm release or on the legacy astro_* indices.
global:
  storageClass: nfs-data

elasticsearch:
  fullnameOverride: atlas-warehouse-elasticsearch
  image:
    registry: container-image-mirror.eva24002.lab.zverse.space:32443/docker.io
    repository: bitnamilegacy/elasticsearch
    tag: 8.12.2-debian-12-r0
  global:
    kibanaEnabled: false
  security:
    enabled: false
  master:
    replicaCount: 1
    masterOnly: false
    heapSize: 512m
    persistence:
      enabled: true
      storageClass: nfs-data
      size: 20Gi
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    networkPolicy:
      enabled: false
  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0
  sysctlImage:
    enabled: false
  volumePermissions:
    enabled: false
  service:
    type: ClusterIP
    ports:
      restAPI: 9200

minio:
  fullnameOverride: atlas-warehouse-minio
  image:
    registry: container-image-mirror.eva24002.lab.zverse.space:32443/docker.io
    repository: bitnamilegacy/minio
    tag: 2024.3.15-debian-12-r0
  clientImage:
    registry: container-image-mirror.eva24002.lab.zverse.space:32443/docker.io
    repository: bitnamilegacy/minio-client
    tag: 2024.3.9-debian-12-r0
  mode: standalone
  auth:
    # Create this namespace-local Secret before install. It must contain
    # root-user and root-password. No credential value belongs in this repo.
    existingSecret: atlas-warehouse-minio-credentials
  defaultBuckets: astro-artifacts
  persistence:
    enabled: true
    storageClass: nfs-data
    size: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  networkPolicy:
    enabled: false
  volumePermissions:
    enabled: false
  service:
    type: ClusterIP
    ports:
      api: 9000
      console: 9001

kafka:
  # Kafka is not required by the current scanner/operator path. Enable it when
  # a future Flink or event-driven deployment needs a chart-owned broker.
  enabled: false
  fullnameOverride: atlas-warehouse-kafka
  image:
    registry: container-image-mirror.eva24002.lab.zverse.space:32443/docker.io
    repository: bitnamilegacy/kafka
    tag: 3.7.1-debian-12-r4
  kraft:
    enabled: true
  zookeeper:
    enabled: false
  listeners:
    client:
      protocol: PLAINTEXT
    controller:
      protocol: PLAINTEXT
    interbroker:
      protocol: PLAINTEXT
  controller:
    replicaCount: 1
    controllerOnly: false
    persistence:
      enabled: true
      storageClass: nfs-data
      size: 10Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    networkPolicy:
      enabled: false
  broker:
    replicaCount: 0
  provisioning:
    enabled: false

indexBootstrap:
  enabled: true
  image:
    repository: container-image-mirror.eva24002.lab.zverse.space:32443/docker.io/curlimages/curl
    tag: 8.10.1
    pullPolicy: IfNotPresent
  backoffLimit: 12
  esEndpoint: http://atlas-warehouse-elasticsearch:9200
